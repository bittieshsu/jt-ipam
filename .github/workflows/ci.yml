name: CI

# 為什麼要有這個：在此之前所有把關都在維護者的機器上（`scripts/ci.sh` + TEST_CHECKLIST）。
# 那對自己夠用，但對外部 PR 完全無效 —— 別人送的修改沒有任何自動驗證。
#
# 這裡跑的東西刻意與 `scripts/ci.sh` 對齊，讓「本機綠 = CI 綠」。差別只有一項：
# CI 另外跑**需要資料庫的測試**，本機那份預設跳過。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector 的官方映像：語意搜尋要 vector 擴充，一般 postgres 映像沒有
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jt_ipam
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: jt_ipam_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jt_ipam"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: jt_ipam
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: jt_ipam_test
      # 測試用的假值：這些不是機密，只是讓設定驗證過關
      JWT_SECRET: ci-not-a-real-secret-ci-not-a-real-secret
      ENCRYPTION_KEY: ci-not-a-real-key-ci-not-a-real-key-0000
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Enable PostgreSQL extensions
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=ci psql -h 127.0.0.1 -U jt_ipam -d jt_ipam_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Migrations (up → down → up)
        working-directory: backend
        run: |
          alembic upgrade head
          # 每個 migration 都要能還原：降一版再升回來，抓「只寫了 upgrade」的那種
          alembic downgrade -1
          alembic upgrade head

      - name: Tests
        working-directory: backend
        env:
          JTIPAM_TEST_DATABASE_URL: postgresql+asyncpg://jt_ipam:ci@127.0.0.1:5432/jt_ipam_test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Types
        working-directory: frontend
        run: pnpm exec vue-tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: pnpm exec eslint src

      - name: Build
        working-directory: frontend
        run: pnpm run build

  audit:
    # 相依套件的漏洞掃描。**High / Critical 會擋下 CI**——掃了卻不擋等於沒掃。
    # 真的暫時修不了時，用 `.github/audit-allowlist.txt` 記下理由與到期日，
    # 而不是把整個步驟改成忽略錯誤。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python dependencies (pip-audit)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip pip-audit
          IGNORE=""
          if [ -f ../.github/audit-allowlist.txt ]; then
            while read -r id _; do
              case "$id" in ''|'#'*) continue;; esac
              IGNORE="$IGNORE --ignore-vuln $id"
            done < ../.github/audit-allowlist.txt
          fi
          # ⚠️ 結尾那個 `.` 不可省：不給路徑時 pip-audit 掃的是**當前環境**，而這個 job
          # 只裝了 pip-audit 本身 —— 那會掃一個空環境然後永遠通過，看起來有把關、
          # 實際上什麼都沒驗。給專案路徑才會解析 pyproject 的相依樹。
          # shellcheck disable=SC2086
          pip-audit --strict --progress-spinner off $IGNORE .

      - name: Node dependencies (pnpm audit)
        working-directory: frontend
        run: pnpm audit --audit-level high
